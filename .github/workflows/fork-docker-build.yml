# Fork Docker Build - uses the shared reusable workflow.
# Builds this fork's single image and publishes it to GHCR on every
# workspace push. Reference: bauer-group/automation-templates.

name: 🐳 Fork Docker Build

on:
  push:
    branches:
      - "workspace/**"
    paths-ignore:
      - ".github/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: fork-docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build:
    name: Build & Push
    uses: bauer-group/automation-templates/.github/workflows/fork-docker-build.yml@main
    with:
      # Single image published to ghcr.io/<owner>/notifuse (no name suffix).
      images: |
        [{"name": "notifuse", "dockerfile": "Dockerfile", "image": "${{ github.repository }}"}]
    secrets: inherit
